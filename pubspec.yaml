name: ddai_lucky_defense
description: "스타크래프트 유즈맵 스타일의 뽑기 기반 랜덤 디펜스 게임 (Flutter + Flame)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # 이름을 자를 때 «글자» 단위로 세려고 쓴다(이모지·결합 문자 안전).
  characters: ^1.4.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.5
  # App Check 토큰을 받을 때 reCAPTCHA 스크립트를 심는 데 쓴다(웹 전용).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
