# 웹 빌드를 GitHub Pages 에 올린다. main 에 푸시하면 자동으로 돈다.
#
# 저장소 이름이 경로에 붙는 주소(.../ddai_lucky_defense/)로 서비스되므로
# `--base-href` 를 맞춰 줘야 한다. 이걸 빼면 flutter_bootstrap.js 를 루트에서
# 찾다가 404 가 나고 빈 화면만 보인다.
#
# 처음 한 번은 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔야 한다.
name: 웹 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # .fvmrc에 고정해 둔 버전과 맞춘다.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: 의존성 받기
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: 웹 빌드
        # 저장소 이름이 바뀌어도 따라가도록 이벤트에서 가져온다.
        #
        # 랭킹 설정은 Secrets 에서 온다. 네 값 모두 «비밀» 이 아니다 — 빌드된
        # JS 에 그대로 실려서 배포 사이트에서 grep 한 번이면 꺼낼 수 있다.
        # Secrets 에 둔 건 포크를 갈라 놓기 위해서일 뿐이다.
        #
        # 고친 빌드가 랭킹에 기록을 올리는 것을 실제로 막는 건 App Check 다.
        # reCAPTCHA 사이트 키가 도메인에 묶여 있어, 등록되지 않은 곳에서는
        # 토큰이 발급되지 않는다(docs/leaderboard.md).
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
