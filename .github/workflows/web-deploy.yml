# 웹 빌드를 GitHub Pages 에 올린다. main 에 푸시하면 자동으로 돈다.
#
# 저장소 이름이 경로에 붙는 주소(.../ddai_lucky_defense/)로 서비스되므로
# `--base-href` 를 맞춰 줘야 한다. 이걸 빼면 flutter_bootstrap.js 를 루트에서
# 찾다가 404 가 나고 빈 화면만 보인다.
#
# 처음 한 번은 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔야 한다.
name: 웹 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # .fvmrc에 고정해 둔 버전과 맞춘다.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: 의존성 받기
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: 웹 빌드
        # 저장소 이름이 바뀌어도 따라가도록 이벤트에서 가져온다.
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
